spring:
  application:
    name: eazystore
  datasource:
    url: jdbc:mysql://${DATABASE_HOST:localhost}:${DATABASE_PORT:3306}/${DATABASE_NAME:eazystore}
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD:root}
  jpa:
    show-sql: ${JPA_SHOW_URL:true}
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL:true}
logging:
  level:
    root: ${LOG_LEVEL:INFO}
  file:
    name: ${LOG_FILENAME:/Users/larrypetroski/Project/Coding/Full Stack/react/logs/app.log}
  pattern:
    console: "%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n"
    file: '{"timestamp":"%d{yyyy-MM-dd HH:mm:ss}","level":"%p","logger":"%c","message":"%m"}'
management:
  endpoint:
    health:
      show-details: ALWAYS
  endpoints:
    web:
      base-path: /eazystore/actuator
      exposure:
        include: "*"
  info:
    env:
      enabled: true
info:
  app:
    name: ${spring.application.name}
    description: Backend project for Eazy store E-Commerce application
    version: 1.0.0
    contact:
      email: dev@test.com
contact:
  phone: 1234567890
  email: dev@test.com
  address: 123 Main Street, Anytown, AR, USA
